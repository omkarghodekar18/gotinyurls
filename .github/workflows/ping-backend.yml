name: Keep Render Backend Awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes
  workflow_dispatch: # allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Curl Render Backend
        run: curl -s https://codelive-qbeo.onrender.com > /dev/null
      - name: Curl GoTinyUrls
        run: curl -s https://gotinyurls.onrender.com > /dev/null
